[project]
name = "retail-therapy"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
categorization = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "threadpoolctl>=3.5",
]
